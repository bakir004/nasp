# Settings for the observability page (observability/index.html).
# Enable with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=observability

# A small quota so limits are reached within seconds.
rate-limit.capacity-tokens=20
rate-limit.window-seconds=10

# Each simulated IP address (sent as X-Forwarded-For) gets its own bucket.
rate-limit.trust-forwarded-for=true

# "null" is the origin of a page opened directly from disk; the pattern covers local web servers.
cors.allowed-origins=null,http://localhost:[*],http://127.0.0.1:[*]
